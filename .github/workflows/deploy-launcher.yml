name: Deploy launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke:launcher

  deploy-launcher:
    needs: validate-main
    if: github.ref == 'refs/heads/main' && vars.SLICE_LAUNCHER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: slice-launcher-production
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment configuration
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing production account ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing production API token"; exit 1; }
          test -n "$SLICE_LAUNCHER_URL" || { echo "::error::Missing launcher URL"; exit 1; }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SLICE_LAUNCHER_URL: ${{ vars.SLICE_LAUNCHER_URL }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slice/launcher... build
      - name: Skip superseded commits
        id: revision
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$current"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping deployment: main has advanced beyond $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy Worker
        if: steps.revision.outputs.current == 'true'
        run: pnpm --filter @slice/launcher run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke check protected launcher
        if: steps.revision.outputs.current == 'true'
        run: |
          test -n "$CF_ACCESS_CLIENT_ID" || { echo "::error::Missing Access client ID"; exit 1; }
          test -n "$CF_ACCESS_CLIENT_SECRET" || { echo "::error::Missing Access client secret"; exit 1; }
          node scripts/check-launcher.mjs "$SLICE_LAUNCHER_URL"
        env:
          SLICE_LAUNCHER_URL: ${{ vars.SLICE_LAUNCHER_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
