name: Deploy launcher

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy-launcher:
    needs: validate-main
    if: vars.SLICE_LAUNCHER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slice/launcher build
      - name: Deploy Worker
        run: pnpm --filter @slice/launcher deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke check through Cloudflare Access
        run: |
          test -n "$SLICE_LAUNCHER_URL"
          status=$(curl --silent --show-error --output health.json --write-out '%{http_code}' \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$SLICE_LAUNCHER_URL/api/health")
          test "$status" = 200
          python3 -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'
        env:
          SLICE_LAUNCHER_URL: ${{ vars.SLICE_LAUNCHER_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
